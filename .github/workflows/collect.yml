name: Collect FAL preseason data

on:
  workflow_dispatch:
  schedule:
    # September 16, 18, 20, 22, 24 and 26 at 09:17 UTC.
    - cron: "17 9 16-26/2 9 *"
    # Final pre-deadline run on September 27 at 14:30 UTC.
    - cron: "30 14 27 9 *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check collection window
        id: window
        shell: bash
        run: |
          if [[ "$(date -u +%Y)" == "2026" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tracker
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect MAL statistics
        if: steps.window.outputs.run == 'true'
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python tracker.py collect --source mal

      - name: Verify and rebuild report
        if: steps.window.outputs.run == 'true'
        run: |
          python -m unittest -v test_tracker.py
          python tracker.py report

      - name: Save new observations
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- tracking_state.json tracking_report.md; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "FAL data collector"
          git config user.email "actions@users.noreply.github.com"
          git add tracking_state.json tracking_report.md
          git commit -m "Collect FAL snapshot $(date -u +%F)"
          git push
